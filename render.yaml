# render.yaml for the AGENT repo. Place at the root of this repo,
# next to Dockerfile, pyproject.toml and uv.lock.
# Deploy via Render Dashboard -> New -> Blueprint -> select this repo.

services:
  - type: web
    name: markto-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt            # keep the same region as the backend (closest to Amsterdam)
    plan: starter                # free instances spin down when idle
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_API_URL     # e.g. https://marketplace-backend.onrender.com
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: REDIS_URL           # e.g. rediss://... (Render Redis add-on)
        sync: false
      - key: AGENT_MODEL_PROVIDER
        sync: false
      - key: NVIDIA_CHAT_MODELS   # Lightning 30B is primary for low latency
        sync: false
      - key: AGENT_CORS_ORIGINS
        sync: false
      - key: AGENT_DEBUG           # 0 = production, 1 = debug (requires AGENT_DEBUG_KEY)
        sync: false
      - key: KB_VECTOR_STORE             # "redis" (default) or "chroma"
        sync: false
      - key: KB_CHROMA_HOST              # required only when KB_VECTOR_STORE=chroma (HTTP server mode)
        sync: false
      - key: KB_CHROMA_PORT              # Chroma server port, default 8000 (only when KB_VECTOR_STORE=chroma)
        sync: false